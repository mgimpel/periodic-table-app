# Simple Workflow to build Artifacts
name: Build All Artifacts
on:
  workflow_dispatch:
    inputs:
      pnpm_version:
        required: true
        type: number
        default: 12
      node_version:
        required: true
        type: number
        default: 26
      build-linux:
        required: true
        type: boolean
        default: true
      build-windows:
        required: true
        type: boolean
        default: true
      build-macos:
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build-linux:
    runs-on: ubuntu-latest
    if: ${{ inputs.build-linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update repositories
        run: sudo apt update && sudo apt upgrade
      - name: Install Rust
        run: sudo apt install -y rustup
      - name: Install Tauri prerequisits
        run: sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm tauri build
      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/deb/*.deb
          archive: false
      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/rpm/*.rpm
          archive: false
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          archive: false
  build-windows:
    runs-on: windows-latest
    if: ${{ inputs.build-windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe" && .\rustup-init.exe -y
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm tauri build
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/msi/*.msi
          archive: false
      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*.exe
          archive: false
  build-macos:
    runs-on: macos-latest
    if: ${{ inputs.build-macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf > rustup.sh && chmod +x ./rustup.sh && ./rustup.sh -y
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm tauri build
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/dmg/*.dmg
          archive: false
      - name: Upload App Artifact
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/macos/*.app
