# Simple Workflow to build Artifacts
name: Build Artifacts
on:
  workflow_dispatch:
    inputs:
      pnpm_version:
        required: true
        type: number
        default: 12
      node_version:
        required: true
        type: number
        default: 26
permissions:
  contents: read
jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      pnpm_version: ${{ inputs.pnpm_version }}
      node_version: ${{ inputs.node_version }}
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      pnpm_version: ${{ inputs.pnpm_version }}
      node_version: ${{ inputs.node_version }}
  build-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      pnpm_version: ${{ inputs.pnpm_version }}
      node_version: ${{ inputs.node_version }}
