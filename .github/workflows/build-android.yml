name: Build Android Artifacts
on:
  workflow_dispatch:
    inputs:
      pnpm_version:
        required: true
        type: number
        default: 12
      node_version:
        required: true
        type: number
        default: 26
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update repositories
        run: sudo apt update && sudo apt upgrade
      - name: Install Rust
        run: sudo apt install -y rustup
      - name: Install Tauri prerequisits
        run: sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      # TODO: install Android SDK & NDK
      - name: Install dependencies
        run: pnpm install
      - name: Initialise Tauri Android
        run: pnpm tauri android init
      - name: Build
        run: pnpm tauri build
